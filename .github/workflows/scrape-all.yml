name: scrape-all

# Manual only. This is the one-time (or deliberately re-run) full backfill: it
# pages through every episode of every podcast, which is slow and hits the NRK
# API hard. The daily job is update.yml.
on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: Podcasts to work on at once
        required: false
        default: "5"
      force:
        description: Re-fetch every episode even if it is already stored
        type: boolean
        required: false
        default: false
      only:
        description: Comma-separated podcast IDs to restrict the run to (blank = all)
        required: false
        default: ""
      max_duration:
        description: >-
          Stop scraping cleanly after this long so progress is committed rather
          than killed by the job timeout. Re-run the workflow to continue.
        required: false
        default: "300m"

permissions:
  contents: write

# Never let two writers race for the same commit on main.
concurrency:
  group: nrk-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A cold backfill of the whole catalogue takes a while.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o nrk-rss ./cmd/nrk-rss

      # The public site root, used for absolute feed URLs in feeds.json and
      # the atom:self link. Override REPO_PAGES_URL as a repository variable if
      # you serve the site from a custom domain.
      - name: Resolve Pages base URL
        run: |
          echo "BASE_URL=${{ vars.REPO_PAGES_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}" >> "$GITHUB_ENV"

      - name: Run scrape-all
        run: |
          ./nrk-rss scrape-all \
            --db state/episodes.db \
            --out docs \
            --base-url "$BASE_URL" \
            --concurrency "${{ inputs.concurrency }}" \
            --max-duration "${{ inputs.max_duration }}" \
            ${{ inputs.force == true && '--force' || '' }} \
            ${{ inputs.only != '' && format('--only {0}', inputs.only) || '' }}

      - name: Commit state and generated site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state docs
          if [ -z "$(git status --porcelain -- state docs)" ]; then
            echo "Nothing changed; skipping commit."
            exit 0
          fi
          git commit -m "chore: full backfill of NRK podcast feeds

          Generated by the scrape-all workflow."
          # Another run may have landed while this one was scraping.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
