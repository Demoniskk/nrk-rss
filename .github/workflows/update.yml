name: update

# The daily job. It only fetches episodes that are not already in
# state/episodes.db, so a normal run costs a handful of requests per podcast.
on:
  schedule:
    # 03:17 UTC — off the hour, to stay out of the crowd of jobs that all fire
    # exactly on the hour.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      concurrency:
        description: Podcasts to work on at once
        required: false
        default: "5"
      max_pages_per_podcast:
        description: Safety cap on episode-list pages read per known podcast
        required: false
        default: "3"

# Publishing is not done here. Pages is configured to deploy from the main
# branch's docs/ directory, so GitHub's own pages-build-deployment picks up the
# commit below on its own. Adding an actions/deploy-pages job as well meant two
# deployments raced for the github-pages environment on every run, and the
# loser was recorded as a failed deployment.
permissions:
  contents: write

concurrency:
  group: nrk-scrape
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o nrk-rss ./cmd/nrk-rss

      - name: Resolve Pages base URL
        run: |
          echo "BASE_URL=${{ vars.REPO_PAGES_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}" >> "$GITHUB_ENV"

      - name: Run update
        run: |
          ./nrk-rss update \
            --db state/episodes.db \
            --out docs \
            --base-url "$BASE_URL" \
            --concurrency "${{ inputs.concurrency || '5' }}" \
            --max-pages-per-podcast "${{ inputs.max_pages_per_podcast || '3' }}" \
            --max-duration 50m

      - name: Commit state and generated site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state docs

          # Skip the commit entirely when nothing changed, so quiet days do not
          # fill the history with empty commits.
          if [ -z "$(git status --porcelain -- state docs)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update NRK podcast feeds"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
